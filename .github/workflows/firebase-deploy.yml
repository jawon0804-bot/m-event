name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Firebase CLI 설치
        run: npm install -g firebase-tools
      - name: Functions 의존성 설치
        run: npm install
        working-directory: functions

      # ────────────────────────────────────────────────────────────────
      # 배포 대상 함수 목록을 functions/index.js의 exports에서 자동 생성한다.
      #
      # 왜 손으로 안 적는가: 이 목록을 하드코딩해뒀다가 새 함수를 추가할 때마다
      # 목록 갱신을 잊어서 "코드는 있는데 배포는 안 되는" 상태가 세 번 반복됐다.
      #   - loginWithCredentials (2026-07-11 발견, 그때까지 수동 배포만 됨)
      #   - workLogDailyInit     (같은 시점 발견)
      #   - generateEventReport / eventReportMonthlyExport / listEventReportFiles
      #     (2026-07-27 발견 — 07-22~23 수동 배포 후 CI에서 계속 빠져 있었고,
      #      그 결과 같은 파일에서 나온 함수 3개가 07-22/07-23 서로 다른 버전으로 떠 있었음)
      # index.js에서 추출하면 함수를 추가/삭제해도 이 파일을 고칠 필요가 없다.
      #
      # ⚠️ `--only functions`(전체)는 절대 쓰지 말 것: 같은 Firebase 프로젝트에
      # m-smart-monitor의 함수(collectMetrics/getDashboardData, us-central1)가 함께
      # 있어서 전체 배포는 그 함수들을 삭제 시도할 수 있다. 아래처럼 codebase
      # 프리픽스(functions:m-event:함수명)를 함수별로 붙이는 형태만 사용한다.
      # ────────────────────────────────────────────────────────────────
      - name: 배포 대상 함수 목록 생성 (index.js exports 기준)
        id: fnlist
        run: |
          set -euo pipefail
          NAMES=$(grep -o '^exports\.[A-Za-z0-9_]*' functions/index.js | sed 's/^exports\.//' | sort -u)
          if [ -z "$NAMES" ]; then
            echo "::error::functions/index.js에서 exports를 찾지 못했습니다 — 잘못된 배포를 막기 위해 중단합니다."
            exit 1
          fi
          LIST=$(echo "$NAMES" | sed 's|^|functions:m-event:|' | paste -sd, -)
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "배포 대상 함수 $(echo "$NAMES" | wc -l | tr -d ' ')개:"
          echo "$NAMES" | sed 's/^/  - /'

      - name: Firebase 배포
        run: firebase deploy --only hosting,firestore:rules,${{ steps.fnlist.outputs.list }} --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
