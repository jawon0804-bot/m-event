name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Firebase CLI 설치
        run: npm install -g firebase-tools
      - name: Functions 의존성 설치
        run: npm install
        working-directory: functions

      # [2026-07-30 추가] 자격증명이 필요 없는 순수 로직 테스트만 배포 전에 돌린다.
      # 실패하면 배포가 멈춘다 — 여기 있는 케이스는 실제로 배포됐던 버그를 굳혀둔 것이라
      # "그럴듯하게 고쳐서" 되돌리는 걸 막는 게 목적이다.
      # (tests/storage-rules.test.js는 GCP 자격증명이 필요해서 CI에서 안 돌린다 —
      #  storage.rules를 고쳤으면 로컬에서 수동으로 돌릴 것. 그 파일 상단 주석 참고)
      - name: 회귀 테스트 (자격증명 불필요)
        run: |
          node tests/client-ip.test.js
          node tests/expected-count.test.js
          node tests/permissions.test.js

      # ────────────────────────────────────────────────────────────────
      # 배포 대상 함수 목록을 functions/index.js의 exports에서 자동 생성한다.
      #
      # 왜 손으로 안 적는가: 이 목록을 하드코딩해뒀다가 새 함수를 추가할 때마다
      # 목록 갱신을 잊어서 "코드는 있는데 배포는 안 되는" 상태가 세 번 반복됐다.
      #   - loginWithCredentials (2026-07-11 발견, 그때까지 수동 배포만 됨)
      #   - workLogDailyInit     (같은 시점 발견)
      #   - generateEventReport / eventReportMonthlyExport / listEventReportFiles
      #     (2026-07-27 발견 — 07-22~23 수동 배포 후 CI에서 계속 빠져 있었고,
      #      그 결과 같은 파일에서 나온 함수 3개가 07-22/07-23 서로 다른 버전으로 떠 있었음)
      # index.js에서 추출하면 함수를 추가/삭제해도 이 파일을 고칠 필요가 없다.
      #
      # ⚠️ `--only functions`(전체)는 절대 쓰지 말 것: 같은 Firebase 프로젝트에
      # m-smart-monitor의 함수(collectMetrics/getDashboardData, us-central1)가 함께
      # 있어서 전체 배포는 그 함수들을 삭제 시도할 수 있다. 아래처럼 codebase
      # 프리픽스(functions:m-event:함수명)를 함수별로 붙이는 형태만 사용한다.
      # ────────────────────────────────────────────────────────────────
      - name: 배포 대상 함수 목록 생성 (index.js exports 기준)
        id: fnlist
        run: |
          set -euo pipefail
          NAMES=$(grep -o '^exports\.[A-Za-z0-9_]*' functions/index.js | sed 's/^exports\.//' | sort -u)
          if [ -z "$NAMES" ]; then
            echo "::error::functions/index.js에서 exports를 찾지 못했습니다 — 잘못된 배포를 막기 위해 중단합니다."
            exit 1
          fi
          LIST=$(echo "$NAMES" | sed 's|^|functions:m-event:|' | paste -sd, -)
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "배포 대상 함수 $(echo "$NAMES" | wc -l | tr -d ' ')개:"
          echo "$NAMES" | sed 's/^/  - /'

      # ⚠️ [2026-07-29] 배포 대상에 firestore:indexes 와 storage 를 추가했다.
      #
      # 그동안 이 저장소가 배포하던 건 hosting + firestore:rules + functions 뿐이었고,
      # **복합 인덱스와 Storage 규칙은 어느 저장소에도 없이 콘솔 상태로만 존재**했다.
      # 그 결과 Storage 규칙이 `allow read, write: if true`(버킷 전체 공개)인 채로
      # 2026-07-10부터 방치돼 있었는데도 코드 리뷰에 한 번도 걸리지 않았다.
      #
      # · firestore:indexes — firestore.indexes.json은 2026-07-29 시점의 실제 배포
      #   상태(10개, 전부 READY)를 그대로 옮긴 것이라 첫 배포는 사실상 no-op이다.
      #   여기 없는 인덱스를 지우지는 않으니, 삭제는 gcloud로 별도 수행할 것.
      # · storage — storage.rules로 버킷 전체 개방을 닫는다. **첫 배포 직후 M-SMART에서
      #   사진 첨부 점검을 1건 제출해 업로드가 되는지 반드시 확인할 것**(규칙이 틀리면
      #   현장에서 storage/unauthorized로 나타난다).
      - name: Firebase 배포
        run: firebase deploy --only hosting,firestore:rules,firestore:indexes,storage,${{ steps.fnlist.outputs.list }} --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
